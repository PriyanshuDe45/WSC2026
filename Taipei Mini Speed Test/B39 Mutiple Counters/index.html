<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fractal Triangle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 16px;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
      max-width: 580px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #111;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .controls label {
      font-size: 14px;
      color: #555;
    }

    .controls input[type="number"] {
      width: 72px;
      padding: 8px 10px;
      font-size: 15px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .controls input[type="number"]:focus {
      border-color: #555;
    }

    .controls button {
      padding: 8px 22px;
      font-size: 15px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .controls button:hover {
      background: #333;
    }

    .controls button:active {
      transform: scale(0.97);
    }

    canvas {
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      width: 100%;
      height: auto;
    }

    .hint {
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fractal Triangle</h1>

    <div class="controls">
      <label for="iters">Iterations:</label>
      <input type="number" id="iters" min="0" max="8" value="3" />
      <button id="drawBtn">Draw</button>
    </div>

    <canvas id="canvas" width="500" height="450"></canvas>

    <p class="hint">Enter a value between 0 and 8, then click Draw.</p>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function drawSierpinski(x1, y1, x2, y2, x3, y3, depth) {
      if (depth === 0) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x3, y3);
        ctx.closePath();
        ctx.fillStyle = '#000000';
        ctx.fill();
        return;
      }

      const mx1 = (x1 + x2) / 2, my1 = (y1 + y2) / 2;
      const mx2 = (x2 + x3) / 2, my2 = (y2 + y3) / 2;
      const mx3 = (x1 + x3) / 2, my3 = (y1 + y3) / 2;

      drawSierpinski(x1,  y1,  mx1, my1, mx3, my3, depth - 1);
      drawSierpinski(mx1, my1, x2,  y2,  mx2, my2, depth - 1);
      drawSierpinski(mx3, my3, mx2, my2, x3,  y3,  depth - 1);
    }

    function draw() {
      let n = parseInt(document.getElementById('iters').value);
      if (isNaN(n) || n < 0) n = 0;
      if (n > 8) n = 8;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const pad = 30;
      const w = canvas.width - pad * 2;
      const h = w * (Math.sqrt(3) / 2);

      const x1 = pad + w / 2,        y1 = (canvas.height - h) / 2;
      const x2 = pad,                 y2 = y1 + h;
      const x3 = pad + w,             y3 = y1 + h;

      drawSierpinski(x1, y1, x2, y2, x3, y3, n);
    }

    document.getElementById('drawBtn').addEventListener('click', draw);

    draw();
  </script>
</body>
</html>
